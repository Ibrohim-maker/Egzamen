<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>FlexBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Yuqori tugmalar -->
        <div class="buttons">
            <button>Display: flex;</button>
            <button>Display: none;</button>
            <button>Display: block;</button>
            <button>Display: inline;</button>
        </div>

        <!-- Asosiy kontent -->
        <div class="content">
            <div class="card">
                <div class="img-box"></div>
                <p>CSS Flexbox — это технология для создания сложных гибких макетов за счёт правильного размещения элементов на странице.</p>
            </div>

            <div class="middle-box">
                <h1>FlexBox</h1>
            </div>

            <div class="card">
                <div class="img-box video-box"></div>
                <p>Flexbox, veb-dizayn jarayonini soddalashtiradi va elementlarni dinamik tarzda joylashuvini boshqarishga yordam beradi.</p>
            </div>
        </div>
    </div>

</body>
</html>
